# Private speech-to-text for Gospel Record voice notes.
# Bound to this machine's Tailscale address only, so it is unreachable from the LAN or the internet.
# Setup: cp .env.example .env, fill it in, then: docker compose up -d --build

services:
  whisper:
    container_name: whisper
    build: .
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8790:8790"
    env_file: .env
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-medium.en}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
    volumes:
      - ./models:/models
      - ./vocab.txt:/app/vocab.txt:ro
